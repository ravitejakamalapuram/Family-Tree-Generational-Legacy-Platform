name: API foundation

on:
  push:
    branches:
      - implementation/fl-002-backend-foundation
  pull_request:
    paths:
      - 'apps/api/**'
      - 'package.json'
      - '.github/workflows/api-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format:api
      - run: npm run lint:api
      - run: npm run typecheck:api
      - run: npm run test:api
      - run: npm run build:api
