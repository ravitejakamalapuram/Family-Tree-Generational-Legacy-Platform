name: Validate OpenAPI

on:
  pull_request:
    paths:
      - "docs/architecture/openapi-v1.yaml"
      - ".github/workflows/openapi-validation.yml"
  push:
    branches:
      - main
      - "workstream/**"
    paths:
      - "docs/architecture/openapi-v1.yaml"
      - ".github/workflows/openapi-validation.yml"

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI 3.1 structural validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle and validate OpenAPI document
        run: npx --yes @redocly/cli@1.34.5 bundle docs/architecture/openapi-v1.yaml --output /tmp/openapi-bundle.yaml
