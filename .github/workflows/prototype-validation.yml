name: Validate UX Prototype

on:
  pull_request:
    paths:
      - "docs/ux/prototype/**"
      - ".github/workflows/prototype-validation.yml"
  push:
    branches:
      - main
      - "workstream/**"
    paths:
      - "docs/ux/prototype/**"
      - ".github/workflows/prototype-validation.yml"

permissions:
  contents: read

jobs:
  prototype:
    name: Check prototype inline JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('docs/ux/prototype/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end <= start) throw new Error('Inline script block not found');
          fs.writeFileSync('/tmp/prototype-inline.js', html.slice(start + 8, end));
          NODE
      - name: Check JavaScript syntax
        run: node --check /tmp/prototype-inline.js
