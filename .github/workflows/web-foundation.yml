name: Web foundation

on:
  push:
    branches:
      - implementation/fl-001-frontend-foundation
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/web-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, v.range, JSON.stringify(v.via.map(x => typeof x === 'string' ? x : x.title)), JSON.stringify(v.fixAvailable))"
      - run: npx prettier --write apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-web-source
          path: apps/web
          retention-days: 1
      - run: npm run format:web
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web
